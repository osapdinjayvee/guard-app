openapi: 3.1.0

info:
  title: Guard Attendance API
  version: 0.1.0-draft
  description: |
    Contract between the Android guard app and the Laravel/Filament backend.

    **Status: DRAFT, awaiting backend sign-off.** Drafted by the Android side from the two
    PRDs so client work can proceed against a stub (T-10) before the backend exists. Seven
    decisions in `.docs/api/DECISIONS.md` are load-bearing and must be ratified before the
    network layer (T-12) is written; each is marked `DECISION` below.

    Two invariants shape this contract:

    1. **Attendance is captured offline and uploaded later.** The device therefore stamps
       `captured_at`; the server records `received_at` separately. They are not the same
       instant and may differ by hours.
    2. **Uploads are retried after network failures.** A commit whose response is lost would
       otherwise create a duplicate record, so `POST /attendance` is idempotent on
       `client_uuid`, which the server must constrain as UNIQUE.

servers:
  - url: https://api.example.invalid/api
    description: Placeholder. The real host is not yet known.
  - url: http://10.0.2.2:8080/api
    description: MockWebServer stub, as seen from the Android emulator (T-10).

security:
  - sanctumToken: []

tags:
  - name: Auth
  - name: Attendance
  - name: Checkpoints
  - name: Content

paths:

  /login:
    post:
      tags: [Auth]
      summary: Authenticate a guard and issue a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, examples: ["guard01"] }
                password: { type: string, format: password }
                device_id:
                  type: string
                  description: Best-effort device identifier. Absent when unavailable.
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token:
                    type: string
                    description: "Sanctum plain-text token, sent as `Authorization: Bearer <token>`."
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /logout:
    post:
      tags: [Auth]
      summary: Invalidate the current token
      description: |
        The client clears its local token regardless of the response. A guard who is offline
        can still log out; the server-side token is then revoked on next contact, or expires.
      responses:
        '204': { description: Token revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /profile:
    get:
      tags: [Auth]
      summary: The authenticated guard's profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /checkpoints:
    get:
      tags: [Checkpoints]
      summary: All checkpoints, for the offline cache
      description: |
        Returned in full, not paginated: the client caches the whole set so a QR code can be
        resolved with no connectivity. Disabled checkpoints are included so the client can
        reject them with a specific message rather than "unknown code".
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Checkpoint' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /checkpoint/validate:
    post:
      tags: [Checkpoints]
      summary: Validate a scanned code against the server
      description: |
        DECISION 5 — optional. The client resolves against its local cache first so scanning
        works offline; this endpoint is a best-effort re-check when online. It must never be
        required to complete a scan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, examples: ["GATE-A"] }
      responses:
        '200':
          description: Valid and active
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Checkpoint' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Known but disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /attendance:
    post:
      tags: [Attendance]
      summary: Submit one attendance record
      description: |
        **Idempotent on `client_uuid`** (DECISION 1). The client generates the UUID once,
        persists it with the record before the first send, and reuses it on every retry.

        - First submission of a `client_uuid` -> `201 Created`.
        - Repeat submission of the same `client_uuid` -> `200 OK` with the existing record.

        Without a UNIQUE constraint on `client_uuid` server-side, a lost `201` response
        produces a duplicate attendance row on the next retry. That is the single most likely
        data-integrity failure in this system.

        The selfie is sent as `multipart/form-data` (DECISION 2), not base64.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - client_uuid
                - qr_checkpoint_id
                - attendance_type
                - selfie
                - captured_at
                - duties_acknowledged
              properties:
                client_uuid:
                  type: string
                  format: uuid
                  description: Client-generated. Server enforces UNIQUE.
                qr_checkpoint_id: { type: integer, format: int64 }
                attendance_type: { $ref: '#/components/schemas/AttendanceType' }
                selfie:
                  type: string
                  format: binary
                  description: JPEG with the metadata watermark already burned into the pixels.
                captured_at:
                  type: string
                  format: date-time
                  description: |
                    Device clock at shutter, ISO 8601 with UTC offset (DECISION 3). May be
                    hours before `received_at`. Device clocks can be wrong or tampered with;
                    the server should flag large `received_at - captured_at` deltas rather
                    than rewrite this value.
                latitude:
                  type: [number, "null"]
                  format: double
                longitude:
                  type: [number, "null"]
                  format: double
                accuracy:
                  type: [number, "null"]
                  format: float
                  description: Metres. Null only when the GPS policy permits submission without a fix.
                duties_acknowledged: { type: boolean, enum: [true] }
                duties_version_id:
                  type: [integer, "null"]
                  format: int64
                  description: Which duties revision the guard acknowledged (DECISION 6).
                device_id: { type: [string, "null"] }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Attendance' }
        '200':
          description: Already recorded. Returned for a repeated `client_uuid`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Attendance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: |
            Rejected: the checkpoint is disabled, or the attendance type is out of sequence.
            The client has already committed this record locally and shown it to the guard, so
            it moves the row to `REJECTED` and surfaces it rather than deleting it (DECISION 7).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Selfie exceeds the server's size limit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /attendance/history:
    get:
      tags: [Attendance]
      summary: The authenticated guard's attendance records
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Attendance' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /attendance/report:
    get:
      tags: [Attendance]
      summary: Aggregated report for the authenticated guard
      parameters:
        - name: range
          in: query
          required: true
          schema:
            type: string
            enum: [daily, weekly, monthly, custom]
        - name: from
          in: query
          description: Required when `range=custom`.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Required when `range=custom`.
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Report' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /sync/attendance:
    post:
      tags: [Attendance]
      summary: Batch upload (optional)
      description: |
        Not used in the MVP. Per-record `POST /attendance` keeps the idempotency and retry
        semantics simple, and a guard's queue is small. Reconsider only if queue depth in the
        field proves the request count is a problem. Multipart batching of several selfies in
        one request also complicates partial failure: each record must be acknowledged
        individually, which this response shape allows for.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                records:
                  type: string
                  description: JSON array of attendance metadata, each with its `client_uuid`.
      responses:
        '207':
          description: Per-record results, in request order.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [client_uuid, status]
                      properties:
                        client_uuid: { type: string, format: uuid }
                        status: { type: integer, examples: [201, 200, 409] }
                        error: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /duties:
    get:
      tags: [Content]
      summary: The active duties content a guard must acknowledge
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Duty' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /announcements:
    get:
      tags: [Content]
      summary: Active announcements for the Home screen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Announcement' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /settings:
    get:
      tags: [Content]
      summary: Server-controlled client configuration
      description: |
        The client reads thresholds from here rather than hardcoding them. Unknown keys are
        ignored; missing keys fall back to the documented defaults, so adding a key is not a
        breaking change.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MobileSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:

  securitySchemes:
    sanctumToken:
      type: http
      scheme: bearer
      description: Laravel Sanctum plain-text token. HTTPS only.

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }

  responses:
    Unauthorized:
      description: |
        Missing, invalid, or revoked token. The client clears the session and routes to login.
        A 401 during background sync must NOT discard the queue: records stay `PENDING` until
        the guard re-authenticates (DECISION 4).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    Error:
      type: object
      required: [error]
      description: The single error envelope used by every non-2xx response.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, machine-readable. The client switches on this, never on `message`.
              examples: ["checkpoint_disabled", "invalid_credentials", "validation_failed"]
            message:
              type: string
              description: Human-readable. Safe to show to a guard.
            details:
              type: object
              description: Field-keyed validation messages, when `code=validation_failed`.
              additionalProperties:
                type: array
                items: { type: string }

    User:
      type: object
      required: [id, name, username, status]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        username: { type: string }
        email: { type: [string, "null"], format: email }
        role: { type: string, examples: ["guard"] }
        status: { type: string, enum: [active, inactive] }

    AttendanceType:
      type: string
      enum: [TIME_IN, TIME_OUT]

    Checkpoint:
      type: object
      required: [id, code, name, status]
      properties:
        id: { type: integer, format: int64 }
        code:
          type: string
          description: The value encoded in the QR image.
        name: { type: string }
        description: { type: [string, "null"] }
        latitude: { type: [number, "null"], format: double }
        longitude: { type: [number, "null"], format: double }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        updated_at: { type: string, format: date-time }

    Attendance:
      type: object
      required:
        - id
        - client_uuid
        - user_id
        - qr_checkpoint_id
        - attendance_type
        - selfie_url
        - captured_at
        - received_at
        - duties_acknowledged
      properties:
        id: { type: integer, format: int64 }
        client_uuid: { type: string, format: uuid }
        user_id: { type: integer, format: int64 }
        qr_checkpoint_id: { type: integer, format: int64 }
        checkpoint_code:
          type: string
          description: Denormalised so History renders without a second request.
        attendance_type: { $ref: '#/components/schemas/AttendanceType' }
        selfie_url:
          type: string
          format: uri
          description: Access-controlled URL for the watermarked image.
        captured_at:
          type: string
          format: date-time
          description: Device clock at shutter.
        received_at:
          type: string
          format: date-time
          description: Server clock when the upload landed. Authoritative for audit.
        latitude: { type: [number, "null"], format: double }
        longitude: { type: [number, "null"], format: double }
        accuracy: { type: [number, "null"], format: float }
        duties_acknowledged: { type: boolean }
        duties_version_id: { type: [integer, "null"], format: int64 }
        device_id: { type: [string, "null"] }

    Duty:
      type: object
      required: [id, title, content, active]
      properties:
        id:
          type: integer
          format: int64
          description: |
            Submitted back as `duties_version_id` so the server knows which revision the guard
            actually acknowledged. A guard may be offline for days and acknowledge a cached
            revision that is no longer current.
        title: { type: string }
        content: { type: string }
        active: { type: boolean }
        effective_date: { type: [string, "null"], format: date }
        updated_at: { type: string, format: date-time }

    Announcement:
      type: object
      required: [id, title, content]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        content: { type: string }
        updated_at: { type: string, format: date-time }

    MobileSettings:
      type: object
      description: Every field is optional; the client falls back to the stated default.
      properties:
        gps_accuracy_threshold_m:
          type: number
          format: float
          default: 50
          description: A fix worse than this is treated as a GPS failure.
        gps_failure_policy:
          type: string
          enum: [block, allow]
          default: block
          description: |
            DECISION 4. `block` prevents submission without an acceptable fix. `allow` permits
            it and stores null coordinates. Applied when the setting has never been fetched.
        gps_timeout_seconds:
          type: integer
          default: 15
          description: How long to wait for a fix before applying `gps_failure_policy`.
        image_quality:
          type: integer
          minimum: 1
          maximum: 100
          default: 80
          description: JPEG quality for the watermarked selfie. Caps the guard's own preference.
        image_max_dimension_px:
          type: integer
          default: 1600
          description: Longest edge. Also bounds the burn-in bitmap, guarding against OOM.
        maintenance_message:
          type: [string, "null"]
          description: Shown on Home when present.

    PageMeta:
      type: object
      required: [page, per_page, total]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    Report:
      type: object
      required: [range, from, to, generated_at, totals, records]
      properties:
        range: { type: string, enum: [daily, weekly, monthly, custom] }
        from: { type: string, format: date }
        to: { type: string, format: date }
        generated_at: { type: string, format: date-time }
        totals:
          type: object
          required: [time_in, time_out]
          properties:
            time_in: { type: integer }
            time_out: { type: integer }
        records:
          type: array
          items: { $ref: '#/components/schemas/Attendance' }
